<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laby Admin</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: #fffaf2;
      --panel-2: #f0e2c8;
      --panel-3: #ead6af;
      --text: #2f2414;
      --muted: #6d5a3d;
      --line: #c8b08a;
      --accent: #8f4e1f;
      --accent-2: #b87333;
      --success: #2f7d4b;
      --danger: #a23434;
      --warning: #9b6a05;
      --shadow: 0 20px 48px rgba(78, 52, 18, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Aptos", "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(184, 115, 51, 0.16), transparent 34%),
        radial-gradient(circle at top right, rgba(143, 78, 31, 0.14), transparent 28%),
        linear-gradient(180deg, #f8f3ea 0%, #f1e5cf 100%);
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }

    button.primary {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff7ef;
      font-weight: 700;
    }

    button.danger {
      color: #fff5f5;
      border: none;
      background: linear-gradient(135deg, #9e2d2d, #c85151);
    }

    button.ghost { background: transparent; }

    button.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      background: rgba(184, 115, 51, 0.12);
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 250, 242, 0.96);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
    }

    textarea { min-height: 110px; resize: vertical; }
    .app { max-width: 1600px; margin: 0 auto; padding: 24px; }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.02em;
    }

    .hero p { margin: 0; color: var(--muted); max-width: 860px; line-height: 1.5; }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .layout.nav-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }

    .card {
      background: rgba(255, 250, 242, 0.82);
      border: 1px solid rgba(200, 176, 138, 0.9);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .nav {
      position: sticky;
      top: 24px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .layout.nav-collapsed .nav {
      display: none;
    }

    .shell-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .burger {
      min-width: 48px;
      padding: 10px 12px;
      font-size: 1.1rem;
      line-height: 1;
    }
    .nav-list { display: grid; gap: 8px; }
    .nav button { text-align: left; padding: 12px 14px; }
    .nav-label { display: block; font-weight: 700; }
    .nav-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 0.88rem; }
    .workspace { display: grid; gap: 18px; }

    .home {
      max-width: 640px;
      margin: 8vh auto 0;
      text-align: center;
      padding: 34px;
    }

    .home h2 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
    }

    .home p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .panel-head h2, .panel-head h3 { margin: 0; }
    .muted { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
    .grid { display: grid; gap: 18px; grid-template-columns: 360px minmax(0, 1fr); }
    .field-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field-grid .span-2 { grid-column: span 2; }
    .field { display: grid; gap: 8px; }
    .field-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    label { font-size: 0.92rem; color: var(--muted); font-weight: 600; }
    .field-icon-btn {
      min-width: 40px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 999px;
      font-size: 1rem;
      line-height: 1;
    }
    .result-list { display: grid; gap: 10px; max-height: 72vh; overflow: auto; padding-right: 4px; }

    .result {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(240, 226, 200, 0.35);
      padding: 12px;
      cursor: pointer;
    }

    .result.active { border-color: var(--accent); background: rgba(184, 115, 51, 0.12); }
    .result-title { font-weight: 700; margin-bottom: 4px; }
    .result-sub { color: var(--muted); font-size: 0.9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); background: rgba(255, 250, 242, 0.85); }
    .meta-bar { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 16px; }
    .meta-box { border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: rgba(240, 226, 200, 0.25); }

    .meta-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.86rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .preview {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.86rem;
      line-height: 1.45;
      white-space: pre-wrap;
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      max-height: 520px;
      overflow: auto;
    }

    .helper-results { display: grid; gap: 8px; max-height: 240px; overflow: auto; margin-top: 10px; }
    .helper-item { border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 250, 242, 0.84); padding: 10px; }
    .helper-item strong { display: block; margin-bottom: 6px; }
    .small { font-size: 0.88rem; }
    .hidden { display: none !important; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(47, 36, 20, 0.38);
      backdrop-filter: blur(5px);
    }
    .overlay-card { min-width: min(420px, 100%); max-width: 520px; text-align: center; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border-radius: 999px;
      border: 3px solid rgba(143, 78, 31, 0.18);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    .overlay h3, .modal h3 { margin: 0 0 8px; }
    .overlay p, .modal p { margin: 0; color: var(--muted); line-height: 1.5; }
    .alert {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 35;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(47, 125, 75, 0.35);
      background: rgba(228, 247, 234, 0.96);
      color: #1e5c36;
      box-shadow: var(--shadow);
    }
    .alert.error {
      border-color: rgba(162, 52, 52, 0.35);
      background: rgba(248, 227, 227, 0.96);
      color: #7f1f1f;
    }
    .modal {
      width: min(900px, 100%);
      max-height: min(86vh, 880px);
      overflow: auto;
    }
    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .modal-section { display: grid; gap: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) {
      .grid, .layout { grid-template-columns: 1fr; }
      .nav {
        position: static;
        display: none;
      }
      .layout.nav-open .nav {
        display: block;
      }
      .meta-bar { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .app { padding: 16px; }
      .hero { flex-direction: column; }
      .field-grid { grid-template-columns: 1fr; }
      .field-grid .span-2 { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div>
        <h1>Laby Admin</h1>
      </div>
      <div class="toolbar">
        <button id="loginBtn" class="primary" type="button">Sign in with GitHub</button>
        <button id="logoutBtn" class="ghost" type="button">Sign out</button>
      </div>
    </div>

    <div class="shell-toolbar">
      <button id="navToggleBtn" class="burger" type="button" aria-expanded="true" aria-controls="navCard">☰</button>
      <div class="muted small">Forms menu</div>
    </div>

    <div id="appLayout" class="layout">
      <aside id="navCard" class="card nav hidden">
        <div class="panel-head"><h3>Forms</h3></div>
        <div id="navList" class="nav-list"></div>
      </aside>

      <main class="workspace">
        <section id="homeView" class="card home">
          <h2>Sign in to continue</h2>
          <p>Home stays intentionally minimal. Once authenticated, you will be returned to the form you were trying to open.</p>
          <button id="homeLoginBtn" class="primary" type="button">Sign in with GitHub</button>
        </section>

        <section id="editorView" class="hidden">
          <div class="grid">
            <section class="card">
              <div class="panel-head">
                <div>
                  <h2 id="searchTitle">Search</h2>
                  <div id="searchSubtitle" class="muted small"></div>
                </div>
                <div class="toolbar">
                  <button id="newRecordBtn" type="button">New</button>
                  <button id="loadSelectedBtn" type="button">Load selected</button>
                </div>
              </div>

              <div class="field">
                <label for="searchInput">Search existing entries</label>
                <input id="searchInput" type="text" placeholder="Search by title or content" />
              </div>

              <div id="resultList" class="result-list"></div>
            </section>

            <section class="card">
              <div class="panel-head">
                <div>
                  <h2 id="editorTitle">Editor</h2>
                  <div id="editorSubtitle" class="muted small"></div>
                </div>
                <div class="toolbar">
                  <button id="modeCreateBtn" type="button">Create</button>
                  <button id="modeUpdateBtn" type="button">Update</button>
                  <button id="modeDeleteBtn" class="danger" type="button">Delete</button>
                  <button id="resetBtn" type="button">Reset</button>
                </div>
              </div>

              <div class="meta-bar">
                <div class="meta-box"><strong>Target file</strong><span id="filePathText">-</span></div>
                <div class="meta-box"><strong>Branch</strong><span id="branchText">-</span></div>
                <div class="meta-box"><strong>Action</strong><span id="actionText">-</span></div>
              </div>

              <form id="recordForm">
                <div id="fieldGrid" class="field-grid"></div>
                <div class="field span-2" style="margin-top: 14px;">
                  <label for="notesInput">Submission notes</label>
                  <textarea id="notesInput" placeholder="Why should this JSON change be accepted?"></textarea>
                </div>
                <div class="toolbar" style="margin-top: 16px;">
                  <button id="previewBtn" type="button">Preview submission payload</button>
                  <button id="submitBtn" class="primary" type="submit">Submit proposal</button>
                </div>
              </form>

              <h3 style="margin-top: 20px;">Preview payload</h3>
              <div id="payloadPreview" class="preview">Nothing yet.</div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="pageOverlay" class="overlay hidden" aria-live="polite" aria-busy="true">
    <div class="card overlay-card">
      <div class="spinner"></div>
      <h3 id="overlayTitle">Working...</h3>
      <p id="overlayMessage">Please wait.</p>
    </div>
  </div>

  <div id="completionAlert" class="alert hidden" role="status" aria-live="polite"></div>

  <div id="helperModalOverlay" class="overlay hidden">
    <div class="card modal">
      <div class="modal-top">
        <div>
          <h3 id="helperModalTitle">Helper</h3>
          <p id="helperModalSubtitle"></p>
        </div>
        <button id="helperModalCloseBtn" class="ghost" type="button">Close</button>
      </div>

      <div id="preReqModalTabs" class="modal-tabs hidden">
        <button id="preReqTabCloneBtn" type="button" class="active">Clone from</button>
        <button id="preReqTabAddBtn" type="button">Add ability</button>
      </div>

      <section id="preReqClonePanel" class="modal-section hidden">
        <div class="field">
          <label for="preReqCloneInput">Search existing records that already have prerequisites</label>
          <input id="preReqCloneInput" type="text" placeholder="Search abilities, miracles, evocations, multi-races..." />
        </div>
        <div id="preReqCloneResults" class="helper-results"></div>
      </section>

      <section id="preReqAddPanel" class="modal-section hidden">
        <div class="field">
          <label for="preReqSearchInput">Add a prerequisite by ability name</label>
          <input id="preReqSearchInput" type="text" placeholder="Search abilities" />
        </div>
        <div id="preReqResults" class="helper-results"></div>
      </section>

      <section id="availabilityPanel" class="modal-section hidden">
        <div class="field">
          <label for="availabilitySearchInput">Search this type for matching availability</label>
          <input id="availabilitySearchInput" type="text" placeholder="Search current route" />
        </div>
        <div id="availabilityResults" class="helper-results"></div>
      </section>

      <section id="lifeScaleBasePanel" class="modal-section hidden">
        <div class="field">
          <label for="lifeScaleBaseInput">Use an existing lifescale as a base</label>
          <input id="lifeScaleBaseInput" type="text" placeholder="Search race or class" />
        </div>
        <div id="lifeScaleBaseResults" class="helper-results"></div>
      </section>
    </div>
  </div>

  <script>
    const CONFIG = {
      authBaseUrl: 'https://laby-auth.bradleyjamesbarfoot.workers.dev',
      submitEndpoint: 'https://laby-auth.bradleyjamesbarfoot.workers.dev/api/propose-change'
    };

    const PENDING_ROUTE_KEY = 'laby-admin-pending-route';
    const SESSION_TOKEN_KEY = 'laby-admin-session-token';

    const ROUTES = {
      home: { id: 'home', label: 'Home', description: 'Login only' },
      abilities: {
        id: 'abilities', label: 'Abilities', singular: 'ability', description: 'Merged evolution abilities',
        dataUrl: 'labyItems/Resources/Raw/evolution_classes/merged.json',
        filePath: 'labyItems/Resources/Raw/evolution_classes/merged.json',
        store: 'array', keyField: 'index', branchPrefix: 'ability', availabilityField: 'available', preReqField: 'preReqs',
        schema: [
          { key: 'index', label: 'Ability name', type: 'text', span: 2, required: true },
          { key: 'table', label: 'Table', type: 'number', required: true },
          { key: 'cost', label: 'Cost', type: 'number', required: true },
          { key: 'sourceBook', label: 'Source book', type: 'text', required: true },
          { key: 'maxAvailable', label: 'maxAvailable', type: 'text' },
          { key: 'desc', label: 'Description', type: 'textarea', span: 2, required: true },
          { key: 'CanAddMultiple', label: 'CanAddMultiple', type: 'boolean' },
          { key: 'canBuyMultiple', label: 'canBuyMultiple', type: 'boolean' },
          { key: 'preReqs', label: 'preReqs', type: 'array-lines', span: 2 },
          { key: 'available', label: 'available', type: 'json', span: 2, defaultValue: [] },
          { key: 'data', label: 'data', type: 'json', span: 2, defaultValue: {} },
          { key: 'abilityRef', label: 'abilityRef', type: 'hidden', defaultValue: '' },
          { key: 'choiceSetRefs', label: 'choiceSetRefs', type: 'hidden', defaultValue: [] }
        ],
        summary(entry) { return `${entry.sourceBook || 'Unknown source'} | table ${entry.table ?? '-'} | cost ${entry.cost ?? '-'}`; }
      },
      guilds: {
        id: 'guilds', label: 'Guilds', singular: 'guild', description: 'Guild definitions',
        dataUrl: 'labyItems/Resources/Raw/people/guilds.json', filePath: 'labyItems/Resources/Raw/people/guilds.json',
        store: 'map', branchPrefix: 'guild', identity: { label: 'Guild name' }, availabilityField: 'Availability',
        schema: [
          { key: 'Type', label: 'Type', type: 'text' },
          { key: 'Logo', label: 'Logo', type: 'text' },
          { key: 'PreRequisites', label: 'PreRequisites', type: 'textarea', span: 2 },
          { key: 'Restrictions', label: 'Restrictions', type: 'textarea', span: 2 },
          { key: 'Ethos', label: 'Ethos', type: 'textarea', span: 2 },
          { key: 'Background', label: 'Background', type: 'textarea', span: 2 },
          { key: 'Benefits', label: 'Benefits', type: 'json', span: 2, defaultValue: { Basic: [], Intermediate: [], Advanced: [] } },
          { key: 'City Benefits', label: 'City Benefits', type: 'json', span: 2, defaultValue: [] },
          { key: 'alignmentRule', label: 'alignmentRule', type: 'json', span: 2 },
          { key: 'MiracleList', label: 'MiracleList', type: 'json', span: 2, defaultValue: {} },
          { key: 'DenominationalMiracle', label: 'DenominationalMiracle', type: 'json', span: 2 },
          { key: 'DenominationalMiracleNote', label: 'DenominationalMiracleNote', type: 'textarea', span: 2 },
          { key: 'Availability', label: 'Availability', type: 'json', span: 2, defaultValue: { Rules: [] } }
        ],
        summary(entry, key) { return `${entry.Type || 'guild'} | ${entry.Availability?.Rules?.length || 0} availability rules | ${key}`; }
      },
      spells: {
        id: 'spells', label: 'Spells', singular: 'spell', description: 'Wizard spell list',
        dataUrl: 'labyItems/Resources/Raw/grimoire/allSpells.json', filePath: 'labyItems/Resources/Raw/grimoire/allSpells.json',
        store: 'array', keyField: 'name', branchPrefix: 'spell',
        schema: [
          { key: 'name', label: 'Spell name', type: 'text', span: 2, required: true },
          { key: 'level', label: 'Level', type: 'number', required: true },
          { key: 'colour', label: 'Colour', type: 'text' },
          { key: 'range', label: 'Range', type: 'text' },
          { key: 'duration', label: 'Duration', type: 'text' },
          { key: 'gesture', label: 'Gesture', type: 'text' },
          { key: 'verbal', label: 'Verbal', type: 'textarea', span: 2 },
          { key: 'description', label: 'Description', type: 'textarea', span: 2, required: true },
          { key: 'notes', label: 'Notes', type: 'textarea', span: 2 },
          { key: 'Damage', label: 'Damage', type: 'json', span: 2 },
          { key: 'isAdvanced', label: 'isAdvanced', type: 'boolean' },
          { key: 'sourcePage', label: 'sourcePage', type: 'number' }
        ],
        summary(entry) { return `${entry.colour || 'Unknown colour'} | level ${entry.level ?? '-'} | ${entry.isAdvanced ? 'advanced' : 'standard'}`; }
      },
      miracles: {
        id: 'miracles', label: 'Miracles', singular: 'miracle', description: 'Priest miracles',
        dataUrl: 'labyItems/Resources/Raw/words_from_above/miracles.json', filePath: 'labyItems/Resources/Raw/words_from_above/miracles.json',
        store: 'array', keyField: 'name', branchPrefix: 'miracle', preReqField: 'preReqs',
        schema: [
          { key: 'name', label: 'Miracle name', type: 'text', span: 2, required: true },
          { key: 'power', label: 'Power', type: 'number', required: true },
          { key: 'alignment', label: 'Alignment', type: 'text' },
          { key: 'sphere', label: 'Sphere', type: 'text' },
          { key: 'level', label: 'Level text', type: 'text' },
          { key: 'range', label: 'Range', type: 'text' },
          { key: 'duration', label: 'Duration', type: 'text' },
          { key: 'gesture', label: 'Gesture', type: 'text' },
          { key: 'verbal', label: 'Verbal', type: 'textarea', span: 2 },
          { key: 'description', label: 'Description', type: 'textarea', span: 2, required: true },
          { key: 'Damage', label: 'Damage', type: 'json', span: 2 },
          { key: 'Heal', label: 'Heal', type: 'json', span: 2 },
          { key: 'preReqs', label: 'preReqs', type: 'array-lines', span: 2 },
          { key: 'isAdvanced', label: 'isAdvanced', type: 'boolean' }
        ],
        summary(entry) { return `${entry.alignment || 'Unknown alignment'} | ${entry.sphere || 'Unknown sphere'} | power ${entry.power ?? '-'}`; }
      },
      neuronics: {
        id: 'neuronics', label: 'Neuronics', singular: 'neuronic', description: 'O-Insight entries',
        dataUrl: 'labyItems/Resources/Raw/o-insight/o_insight_neuronics.json', filePath: 'labyItems/Resources/Raw/o-insight/o_insight_neuronics.json',
        store: 'array', keyField: 'name', branchPrefix: 'neuronic',
        schema: [
          { key: 'name', label: 'Name', type: 'text', span: 2, required: true },
          { key: 'power', label: 'Power', type: 'number', required: true },
          { key: 'range', label: 'Range', type: 'text' },
          { key: 'duration', label: 'Duration', type: 'text' },
          { key: 'immunities', label: 'immunities', type: 'text' },
          { key: 'description', label: 'Description', type: 'textarea', span: 2, required: true },
          { key: 'Damage', label: 'Damage', type: 'json', span: 2 }
        ],
        summary(entry) { return `${entry.power ?? '-'} power | ${entry.range || 'Unknown range'}`; }
      },
      evocations: {
        id: 'evocations', label: 'Evocations', singular: 'evocation', description: 'Druid evocations',
        dataUrl: 'labyItems/Resources/Raw/druids_way/evocs.json', filePath: 'labyItems/Resources/Raw/druids_way/evocs.json',
        store: 'array', keyField: 'name', branchPrefix: 'evocation', preReqField: 'preReqs',
        schema: [
          { key: 'name', label: 'Name', type: 'text', span: 2, required: true },
          { key: 'power', label: 'Power', type: 'number', required: true },
          { key: 'range', label: 'Range', type: 'text' },
          { key: 'duration', label: 'Duration', type: 'text' },
          { key: 'fields', label: 'fields', type: 'array-lines', span: 2, defaultValue: [] },
          { key: 'verbal', label: 'Verbal', type: 'textarea', span: 2 },
          { key: 'description', label: 'Description', type: 'textarea', span: 2, required: true },
          { key: 'preReqs', label: 'preReqs', type: 'array-lines', span: 2, defaultValue: [] },

    async function init() {
      showOverlay('Loading admin', 'Checking your session and preparing the editor.');
      if (window.matchMedia('(max-width: 1200px)').matches) {
        state.navOpen = false;
      }
      wireEvents();
      renderNav();
      updateNavVisibility();
      consumeSessionTokenFromUrl();
      await checkAuth();
      await handleRouteChange();
      hideOverlay();

    function wireEvents() {
      window.addEventListener('hashchange', () => {
        handleRouteChange().catch(error => showAlert(error.message, true));
      });

      els.loginBtn.addEventListener('click', beginLogin);
      els.homeLoginBtn.addEventListener('click', beginLogin);
      els.logoutBtn.addEventListener('click', beginLogout);
      els.navToggleBtn.addEventListener('click', toggleNav);
      els.searchInput.addEventListener('input', renderSearchResults);
      els.newRecordBtn.addEventListener('click', () => {
        state.selectedRecord = null;
        setMode('create');
        fillFormForCreate();
      });
      els.loadSelectedBtn.addEventListener('click', () => {
        if (!state.selectedRecord) {
          showAlert('Select a record first.', true);
          return;
        }
        setMode('update');
        fillFormFromRecord(state.selectedRecord);
      });
      els.modeCreateBtn.addEventListener('click', () => {
        setMode('create');
        if (!state.selectedRecord) fillFormForCreate();
      });
      els.modeUpdateBtn.addEventListener('click', () => {
        if (!state.selectedRecord) {
          showAlert('Select a record before switching to update mode.', true);
          return;
        }
        setMode('update');
        fillFormFromRecord(state.selectedRecord);
      });
      els.modeDeleteBtn.addEventListener('click', () => {
        if (!state.selectedRecord) {
          showAlert('Select a record before switching to delete mode.', true);
          return;
        }
        setMode('delete');
        fillFormFromRecord(state.selectedRecord);
      });
      els.resetBtn.addEventListener('click', () => {
        if (state.selectedRecord && state.mode !== 'create') fillFormFromRecord(state.selectedRecord);
        else fillFormForCreate();
      });
      els.previewBtn.addEventListener('click', onPreview);
      els.recordForm.addEventListener('submit', onSubmit);
      els.preReqSearchInput.addEventListener('input', renderPreReqSearch);
      els.preReqCloneInput.addEventListener('input', renderPreReqCloneSearch);
      els.availabilitySearchInput.addEventListener('input', renderAvailabilitySearch);
      els.lifeScaleBaseInput.addEventListener('input', renderLifeScaleBaseSearch);
      els.helperModalCloseBtn.addEventListener('click', closeHelperModal);
      els.helperModalOverlay.addEventListener('click', event => {
        if (event.target === els.helperModalOverlay) closeHelperModal();
      });
      els.preReqTabCloneBtn.addEventListener('click', () => {
        state.preReqTab = 'clone';
        renderHelperModalState();
      });
      els.preReqTabAddBtn.addEventListener('click', () => {
        state.preReqTab = 'add';
        renderHelperModalState();
      });
    }
    function getSessionToken() {
      return sessionStorage.getItem(SESSION_TOKEN_KEY);
    }

    function setSessionToken(token) {
      if (token) sessionStorage.setItem(SESSION_TOKEN_KEY, token);
    }

    function clearSessionToken() {
      sessionStorage.removeItem(SESSION_TOKEN_KEY);
    }

    function consumeSessionTokenFromUrl() {
      const url = new URL(window.location.href);
      const token = url.searchParams.get('session_token');

      if (token) {
        setSessionToken(token);
        url.searchParams.delete('session_token');
        url.searchParams.delete('login');
        history.replaceState(null, '', url.toString());
      }
    }

    function beginLogin() {
      const currentHash = window.location.hash || '#/abilities';
      sessionStorage.setItem(PENDING_ROUTE_KEY, currentHash);
      window.location.href = `${CONFIG.authBaseUrl}/auth/start`;
    }

    function beginLogout() {
      sessionStorage.removeItem(PENDING_ROUTE_KEY);
      clearSessionToken();
      state.authUser = null;
      window.location.href = `${CONFIG.authBaseUrl}/auth/logout`;
    }

    async function checkAuth() {
      try {
        const token = getSessionToken();

        if (!token) {
          state.authUser = null;
          return;
        }

        const response = await fetch(`${CONFIG.authBaseUrl}/auth/me`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          clearSessionToken();
          state.authUser = null;
          return;
        }

        const data = await response.json();
        state.authUser = data.user || null;
      } catch (error) {
        clearSessionToken();
        state.authUser = null;
        showAlert(`Could not verify login: ${error.message}`, true);
      }
    }

    async function handleRouteChange() {
      const routeState = parseHash();
      let routeId = routeState.routeId;
      if (!ROUTES[routeId]) routeId = 'home';
      state.currentRouteId = routeId;

      if (!state.authUser && routeId !== 'home') {
        sessionStorage.setItem(PENDING_ROUTE_KEY, `#/${routeId}`);
        navigate('home', { callback: routeId }, true);
        renderForRoute('home');
        return;
      }

      if (state.authUser && routeId === 'home') {
        const storedRoute = sessionStorage.getItem(PENDING_ROUTE_KEY);
        if (storedRoute && storedRoute.startsWith('#/')) {
          sessionStorage.removeItem(PENDING_ROUTE_KEY);
          history.replaceState(null, '', `${window.location.pathname}${window.location.search}${storedRoute}`);
          await handleRouteChange();
          return;
        }

        const callback = routeState.params.get('callback');
        if (callback && ROUTES[callback] && callback !== 'home') {
          navigate(callback, {}, true);
          return;
        }
        navigate('abilities', {}, true);
        return;
      }

      if (routeId !== 'home') await ensureRouteData(routeId);
      renderForRoute(routeId);
    }

    function parseHash() {
      const raw = (window.location.hash || '#/home').slice(1);
      const [pathPart, queryPart = ''] = raw.split('?');
      const routeId = pathPart.replace(/^\//, '') || 'home';
      return { routeId, params: new URLSearchParams(queryPart) };
    }

    function navigate(routeId, params = {}, replace = false) {
      const search = new URLSearchParams(params);
      const nextHash = `#/${routeId}${search.toString() ? `?${search.toString()}` : ''}`;
      if (replace) history.replaceState(null, '', `${window.location.pathname}${window.location.search}${nextHash}`);
      else window.location.hash = nextHash;
    }

    function renderNav() {
      els.navList.innerHTML = '';
      for (const route of Object.values(ROUTES)) {
        if (route.id === 'home') continue;
        const button = document.createElement('button');
        button.type = 'button';
        button.innerHTML = `<span class="nav-label">${escapeHtml(route.label)}</span><span class="nav-sub">${escapeHtml(route.description)}</span>`;
        button.addEventListener('click', () => {
          navigate(route.id);
          if (window.matchMedia('(max-width: 1200px)').matches) {
            state.navOpen = false;
            updateNavVisibility();
          }
        });
        button.dataset.routeId = route.id;
        els.navList.appendChild(button);
      }
    }

    function toggleNav() {
      state.navOpen = !state.navOpen;
      updateNavVisibility();
    }

    function updateNavVisibility() {
      els.navToggleBtn.setAttribute('aria-expanded', String(state.navOpen));
      els.appLayout.classList.toggle('nav-open', state.navOpen);
      els.appLayout.classList.toggle('nav-collapsed', !state.navOpen);
      els.navToggleBtn.textContent = state.navOpen ? '✕' : '☰';
    }

    function renderForRoute(routeId) {
      const isHome = routeId === 'home' || !state.authUser;
      els.homeView.classList.toggle('hidden', !isHome);
      els.editorView.classList.toggle('hidden', isHome);
      els.navCard.classList.toggle('hidden', !state.authUser);
      els.navToggleBtn.classList.toggle('hidden', !state.authUser);
      els.loginBtn.classList.toggle('hidden', !!state.authUser);
      updateNavVisibility();

      for (const button of els.navList.querySelectorAll('button')) {
        button.classList.toggle('active', button.dataset.routeId === routeId);
      }

      if (isHome) return;

      const route = ROUTES[routeId];
      state.selectedRecord = null;
      state.mode = 'create';
      els.searchInput.value = '';
      els.notesInput.value = '';
      els.payloadPreview.textContent = 'Nothing yet.';
      renderEditorShell(route);
      renderSearchResults();
      fillFormForCreate();
      updateMetaBar();
      closeHelperModal();
    }

    async function ensureRouteData(routeId) {
      if (state.routeData[routeId]) return state.routeData[routeId];

      const route = ROUTES[routeId];
      const response = await fetch(route.dataUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load ${route.dataUrl}`);

      const raw = await response.json();
      state.routeData[routeId] = { raw, records: normalizeRecords(route, raw) };
      return state.routeData[routeId];
    }

    function normalizeRecords(route, raw) {
      if (route.store === 'array') {
        return (Array.isArray(raw) ? raw : []).map((value, index) => ({
          recordId: `${route.id}:${index}`,
          primaryKey: String(value?.[route.keyField] ?? `${route.singular} ${index + 1}`),
          secondaryKey: null,
          value: deepClone(value ?? {})
        }));
      }

      if (route.store === 'map') {
        return Object.entries(raw || {}).map(([key, value]) => ({
          recordId: `${route.id}:${key}`,
          primaryKey: key,
          secondaryKey: null,
          value: deepClone(value ?? {})
        }));
      }

      if (route.store === 'nested-map') {
        const container = raw?.[route.containerKey] || {};
        return Object.entries(container).map(([key, value]) => ({
          recordId: `${route.id}:${key}`,
          primaryKey: key,
          secondaryKey: null,
          value: deepClone(value ?? {})
        }));
      }

      if (route.store === 'lifescales') {
        const records = [];
        for (const [race, classMap] of Object.entries(raw || {})) {
          for (const [className, points] of Object.entries(classMap || {})) {
            records.push({
              recordId: `${route.id}:${race}:${className}`,
              primaryKey: race,
              secondaryKey: className,
              value: deepClone(points ?? [])
            });
          }
        }
        return records;
      }

      return [];
    }

    function renderEditorShell(route) {
      els.searchTitle.textContent = `${route.label} search`;
      els.searchSubtitle.textContent = route.description;
      els.editorTitle.textContent = `${route.label} editor`;
      els.editorSubtitle.textContent = `Create, amend, or delete ${route.singular} entries against ${route.filePath}`;
      renderFields(route);
    }

    function renderFields(route) {
      els.fieldGrid.innerHTML = '';
      state.fieldRefs = {};

      if (route.store === 'map' || route.store === 'nested-map') {
        const primary = buildFieldControl({ key: '__primaryKey', label: route.identity.label, type: 'text', span: 2, required: true });
        state.fieldRefs.__primaryKey = primary.control;
        els.fieldGrid.appendChild(primary.wrapper);
      }

      if (route.store === 'lifescales') {
        const raceField = buildFieldControl({ key: '__primaryKey', label: route.identity.label, type: 'text', required: true });
        const classField = buildFieldControl({ key: '__secondaryKey', label: route.identity.secondaryLabel, type: 'text', required: true });
        state.fieldRefs.__primaryKey = raceField.control;
        state.fieldRefs.__secondaryKey = classField.control;
        els.fieldGrid.appendChild(raceField.wrapper);
        els.fieldGrid.appendChild(classField.wrapper);
      }

      for (const field of route.schema) {
        if (field.type === 'identity' || field.type === 'identity-secondary') continue;
        const built = buildFieldControl(field);
        state.fieldRefs[field.key] = built.control;
        els.fieldGrid.appendChild(built.wrapper);
      }
    }

    function buildFieldControl(field) {
      const wrapper = document.createElement('div');
      wrapper.className = `field${field.span === 2 ? ' span-2' : ''}`;
      if (field.type === 'hidden') wrapper.classList.add('hidden');

      const fieldHead = document.createElement('div');
      fieldHead.className = 'field-head';
      const label = document.createElement('label');
      label.textContent = field.label;
      fieldHead.appendChild(label);

      let control;
      if (
        field.type === 'textarea'
        || field.type === 'json'
        || field.type === 'lifescale-points'
        || field.type === 'array-lines'
      ) control = document.createElement('textarea');
      else if (field.type === 'boolean') {
        control = document.createElement('select');
        control.innerHTML = `<option value="">Unset</option><option value="true">true</option><option value="false">false</option>`;
      } else {
        control = document.createElement('input');
        control.type = field.type === 'number' ? 'number' : 'text';
      }

      control.id = `field-${field.key.replace(/[^a-z0-9_-]/gi, '-')}`;
      label.htmlFor = control.id;
      if (field.placeholder) control.placeholder = field.placeholder;
      if (field.required) control.required = true;
      if (field.type === 'number') control.step = '1';
      control.addEventListener('input', () => updateMetaBar());
      const helperButton = buildFieldHelperButton(field);
      if (helperButton) fieldHead.appendChild(helperButton);
      wrapper.appendChild(fieldHead);
      wrapper.appendChild(control);
      return { wrapper, control };
    }

    function buildFieldHelperButton(field) {
      const route = ROUTES[state.currentRouteId];
      if (!route) return null;

      let helperType = null;
      if (route.preReqField && field.key === route.preReqField) helperType = 'prereq';
      if (route.availabilityField && field.key === route.availabilityField) helperType = 'availability';
      if (route.id === 'lifescales' && field.key === '__points') helperType = 'lifescale-base';
      if (!helperType) return null;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'field-icon-btn';
      button.textContent = '⌕';
      button.title = helperType === 'availability' ? 'Search existing availability' : 'Open helper';
      button.addEventListener('click', () => openHelperModal(helperType));
      return button;
    }
    function renderSearchResults() {
      const route = ROUTES[state.currentRouteId];
      const data = state.routeData[state.currentRouteId];
      if (!route || !data) return;

      const query = els.searchInput.value.trim().toLowerCase();
      const filtered = data.records.filter(record => {
        if (!query) return true;
        return buildSearchText(route, record).includes(query);
      });

      els.resultList.innerHTML = '';
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'muted small';
        empty.textContent = 'No matching entries.';
        els.resultList.appendChild(empty);
        return;
      }

      for (const record of filtered) {
        const div = document.createElement('div');
        div.className = `result${state.selectedRecord?.recordId === record.recordId ? ' active' : ''}`;
        const title = record.secondaryKey ? `${record.primaryKey} / ${record.secondaryKey}` : record.primaryKey;
        div.innerHTML = `
          <div class="result-title">${escapeHtml(title)}</div>
          <div class="result-sub">${escapeHtml(route.summary?.(record.value, record.primaryKey) || '')}</div>
          <div class="chips">
            <span class="chip">${escapeHtml(route.singular)}</span>
            <span class="chip">${escapeHtml(route.filePath)}</span>
          </div>
        `;
        div.addEventListener('click', () => {
          state.selectedRecord = record;
          if (state.mode !== 'create') fillFormFromRecord(record);
          renderSearchResults();
          updateMetaBar();
        });
        els.resultList.appendChild(div);
      }
    }

    function buildSearchText(route, record) {
      return [route.label, record.primaryKey, record.secondaryKey || '', safeJson(record.value)].join(' ').toLowerCase();
    }

    function fillFormForCreate() {
      const route = ROUTES[state.currentRouteId];
      if (!route) return;
      clearFields(route);
      applyDefaults(route);
      setMode('create');
      updateMetaBar();
    }

    function fillFormFromRecord(record) {
      const route = ROUTES[state.currentRouteId];
      if (!route || !record) return;
      clearFields(route);
      applyDefaults(route);

      if (route.store === 'map' || route.store === 'nested-map') {
        state.fieldRefs.__primaryKey.value = record.primaryKey;
      }

      if (route.store === 'lifescales') {
        state.fieldRefs.__primaryKey.value = record.primaryKey;
        state.fieldRefs.__secondaryKey.value = record.secondaryKey || '';
        state.fieldRefs.__points.value = lifeScalePointsToText(record.value);
      }

      for (const field of route.schema) {
        if (field.type === 'identity' || field.type === 'identity-secondary') continue;
        const control = state.fieldRefs[field.key];
        if (!control) continue;
        control.value = fieldValueToInput(field, record.value?.[field.key]);
      }

      updateFieldLocking();
      updateMetaBar();
    }

    function clearFields(route) {
      els.notesInput.value = '';
      for (const key of Object.keys(state.fieldRefs)) state.fieldRefs[key].value = '';
      if (route.store === 'lifescales' && state.fieldRefs.__points) state.fieldRefs.__points.value = '';
    }

    function applyDefaults(route) {
      for (const field of route.schema) {
        const control = state.fieldRefs[field.key];
        if (!control) continue;
        if (field.defaultValue !== undefined) control.value = fieldValueToInput(field, field.defaultValue);
      }
    }

    function fieldValueToInput(field, value) {
      if (value === undefined || value === null) return '';
      if (field.type === 'boolean') return value === true ? 'true' : value === false ? 'false' : '';
      if (field.type === 'json') return JSON.stringify(value, null, 2);
      if (field.type === 'array-lines') return Array.isArray(value) ? value.join('\n') : '';
      if (field.type === 'lifescale-points') return lifeScalePointsToText(value);
      return String(value);
    }

    function lifeScalePointsToText(points) {
      return (Array.isArray(points) ? points : [])
        .map(pair => Array.isArray(pair) ? `${pair[0] ?? ''}, ${pair[1] ?? ''}` : '')
        .filter(Boolean)
        .join('\n');
    }

    function setMode(mode) {
      state.mode = mode;
      els.modeCreateBtn.classList.toggle('active', mode === 'create');
      els.modeUpdateBtn.classList.toggle('active', mode === 'update');
      els.modeDeleteBtn.classList.toggle('active', mode === 'delete');
      updateFieldLocking();
      updateMetaBar();
    }

    function updateFieldLocking() {
      const disabled = state.mode === 'delete';
      for (const control of Object.values(state.fieldRefs)) control.disabled = disabled;
      els.notesInput.disabled = false;
    }

    function updateMetaBar() {
      const route = ROUTES[state.currentRouteId];
      if (!route || route.id === 'home') return;
      els.filePathText.textContent = route.filePath;
      els.actionText.textContent = `${state.mode} ${route.singular}`;
      els.branchText.textContent = buildBranchName();
    }

    function buildBranchName() {
      const route = ROUTES[state.currentRouteId];
      if (!route || route.id === 'home') return '-';
      const title = getProposedPrimaryKey() || state.selectedRecord?.primaryKey || route.singular;
      return `${route.branchPrefix}/${slugify(title)}/${state.mode}/${shortTimestamp()}`;
    }

    function shortTimestamp() {
      const now = new Date();
      const pad = value => String(value).padStart(2, '0');
      return `${String(now.getUTCFullYear()).slice(-2)}-${pad(now.getUTCMonth() + 1)}-${pad(now.getUTCDate())}-${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}`;
    }

    function getProposedPrimaryKey() {
      const route = ROUTES[state.currentRouteId];
      if (!route) return '';
      if (route.store === 'array') return state.fieldRefs[route.keyField]?.value.trim() || '';
      return state.fieldRefs.__primaryKey?.value.trim() || '';
    }

    function getProposedSecondaryKey() {
      return state.fieldRefs.__secondaryKey?.value.trim() || '';
    }

    function buildRecordFromForm() {
      const route = ROUTES[state.currentRouteId];
      if (!route) throw new Error('No active route.');
      if (route.store === 'lifescales') return parseLifeScalePoints(state.fieldRefs.__points.value);

      const record = {};
      for (const field of route.schema) {
        if (field.type === 'identity' || field.type === 'identity-secondary' || field.type === 'hidden') {
          if (field.type === 'hidden') record[field.key] = deepClone(field.defaultValue);
          continue;
        }

        const control = state.fieldRefs[field.key];
        if (!control) continue;
        const value = parseFieldValue(field, control.value);
        if (value === undefined) continue;
        record[field.key] = value;
      }

      if (route.id === 'abilities') {
        record.abilityRef = '';
        record.choiceSetRefs = [];
      }

      return record;
    }

    function parseFieldValue(field, raw) {
      const trimmed = raw.trim();
      if (field.type === 'number') {
        if (!trimmed) return undefined;
        const parsed = Number(trimmed);
        if (!Number.isFinite(parsed)) throw new Error(`${field.label} must be a number.`);
        return parsed;
      }
      if (field.type === 'boolean') return !trimmed ? undefined : trimmed === 'true';
      if (field.type === 'json') {
        if (!trimmed) return undefined;
        try { return JSON.parse(trimmed); }
        catch { throw new Error(`${field.label} must be valid JSON.`); }
      }
      if (field.type === 'array-lines') {
        if (!trimmed) return [];

        if (trimmed.startsWith('[')) {
          try {
            const parsed = JSON.parse(trimmed);
            if (!Array.isArray(parsed)) throw new Error();
            return parsed.map(value => String(value).trim()).filter(Boolean);
          } catch {
            throw new Error(`${field.label} must be one entry per line or a JSON string array.`);
          }
        }

        return trimmed
          .split(/\r?\n/)
          .map(line => line.trim())
          .filter(Boolean);
      }
      if (field.type === 'lifescale-points') return parseLifeScalePoints(trimmed);
      return trimmed || undefined;
    }

    function parseLifeScalePoints(raw) {
      const lines = raw.split('\n').map(line => line.trim()).filter(Boolean);
      return lines.map((line, index) => {
        const parts = line.split(',').map(part => part.trim());
        if (parts.length !== 2) throw new Error(`Life scale row ${index + 1} must be "body, loc".`);
        const body = Number(parts[0]);
        const loc = Number(parts[1]);
        if (!Number.isFinite(body) || !Number.isFinite(loc)) throw new Error(`Life scale row ${index + 1} must contain two numbers.`);
        return [body, loc];
      });
    }

    function buildSubmissionPayload() {
      const route = ROUTES[state.currentRouteId];
      if (!route || route.id === 'home') throw new Error('Choose a form first.');
      if (!state.authUser) throw new Error('You are not authenticated with the worker.');

      const primaryKey = getProposedPrimaryKey();
      const secondaryKey = getProposedSecondaryKey();
      if (!primaryKey) throw new Error('A record name is required.');
      if (route.store === 'lifescales' && !secondaryKey) throw new Error('A class name is required.');
      if (state.mode !== 'create' && !state.selectedRecord) throw new Error('Update and delete actions require an existing selected record.');

      const record = state.mode === 'delete' ? null : buildRecordFromForm();
      validateRecord(route, record, primaryKey);

      const basePayload = {
        entityType: route.id,
        entityLabel: route.label,
        operation: state.mode,
        filePath: route.filePath,
        branchName: buildBranchName(),
        submittedBy: state.authUser.login,
        notes: els.notesInput.value.trim(),
        storage: {
          strategy: route.store,
          keyField: route.keyField || null,
          containerKey: route.containerKey || null
        }
      };

      if (state.mode === 'create') {
        return {
          ...basePayload,
          create: {
            key: {
              primaryKey,
              secondaryKey: secondaryKey || null
            },
            record
          }
        };
      }

      const match = {
        primaryKey: state.selectedRecord?.primaryKey || null,
        secondaryKey: state.selectedRecord?.secondaryKey || null
      };

      if (state.mode === 'delete') {
        return {
          ...basePayload,
          delete: {
            match
          }
        };
      }

      return {
        ...basePayload,
        update: {
          match,
          key: {
            primaryKey,
            secondaryKey: secondaryKey || null
          },
          record,
          rename: {
            changed: primaryKey !== (state.selectedRecord?.primaryKey || ''),
            from: state.selectedRecord?.primaryKey || null,
            to: primaryKey
          }
        }
      };
    }
    function validateRecord(route, record, primaryKey) {
      if (state.mode === 'delete') return;
      if (!primaryKey) throw new Error(`${route.singular} name is required.`);
      if (route.store === 'array' && route.keyField && !record?.[route.keyField]) throw new Error(`${route.keyField} is required.`);
      if (route.id === 'abilities') {
        if (!record.index) throw new Error('Ability name is required.');
        if (!record.desc) throw new Error('Description is required.');
        if (!record.sourceBook) throw new Error('Source book is required.');
        if (!Number.isFinite(record.table)) throw new Error('Table must be numeric.');
        if (!Number.isFinite(record.cost)) throw new Error('Cost must be numeric.');
      }
    }

    function onPreview() {
      try {
        const payload = buildSubmissionPayload();
        els.payloadPreview.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        showAlert(error.message, true);
      }
    }

    async function onSubmit(event) {
      event.preventDefault();
      try {
        const payload = buildSubmissionPayload();
        els.payloadPreview.textContent = JSON.stringify(payload, null, 2);
        els.submitBtn.disabled = true;
        showOverlay('Submitting proposal', 'Creating the branch, commit, and pull request.');

        const token = getSessionToken();
        if (!token) {
          throw new Error('You are not authenticated with the worker.');
        }

        const response = await fetch(CONFIG.submitEndpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const responseText = await response.text();
        let responseJson;
        try { responseJson = JSON.parse(responseText); }
        catch { responseJson = { raw: responseText }; }

        if (!response.ok) {
          throw new Error(responseJson.message || responseJson.error || `Submission failed with status ${response.status}`);
        }

        showAlert('Proposal submitted successfully.', false);
      } catch (error) {
        console.error(error);
        showAlert(error.message, true);
      } finally {
        els.submitBtn.disabled = false;
        hideOverlay();
      }
    }

    async function renderPreReqSearch() {
      const route = ROUTES[state.currentRouteId];
      if (!route?.preReqField) return;

      await ensureRouteData('abilities');
      const abilities = state.routeData.abilities.records;
      const query = els.preReqSearchInput.value.trim().toLowerCase();
      const hits = abilities.filter(record => !query || buildSearchText(ROUTES.abilities, record).includes(query)).slice(0, 12);

      els.preReqResults.innerHTML = '';
      for (const hit of hits) {
        const item = document.createElement('div');
        item.className = 'helper-item';
        item.innerHTML = `<strong>${escapeHtml(hit.primaryKey)}</strong><div class="small muted">${escapeHtml(ROUTES.abilities.summary(hit.value))}</div>`;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Add to preReqs';
        button.style.marginTop = '8px';
        button.addEventListener('click', () => {
          appendLineValue(route.preReqField, hit.primaryKey);
          closeHelperModal();
        });
        item.appendChild(button);
        els.preReqResults.appendChild(item);
      }
    }

    async function renderPreReqCloneSearch() {
      const route = ROUTES[state.currentRouteId];
      if (!route?.preReqField) return;

      const searchableRoutes = Object.values(ROUTES)
        .filter(candidate => candidate.preReqField && candidate.id !== route.id)
        .map(candidate => candidate.id);
      for (const routeId of searchableRoutes) await ensureRouteData(routeId);

      const query = els.preReqCloneInput.value.trim().toLowerCase();
      const pool = searchableRoutes.flatMap(routeId =>
        state.routeData[routeId].records
          .filter(record => Array.isArray(record.value?.preReqs) && record.value.preReqs.length)
          .map(record => ({ routeId, record }))
      );

      const hits = pool.filter(({ routeId, record }) => {
        const haystack = `${routeId} ${record.primaryKey} ${safeJson(record.value.preReqs)}`.toLowerCase();
        return !query || haystack.includes(query);
      }).slice(0, 10);

      els.preReqCloneResults.innerHTML = '';
      for (const hit of hits) {
        const item = document.createElement('div');
        item.className = 'helper-item';
        item.innerHTML = `<strong>${escapeHtml(hit.record.primaryKey)}</strong><div class="small muted">${escapeHtml(hit.routeId)} | ${hit.record.value.preReqs.length} prereqs</div>`;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Use these preReqs';
        button.style.marginTop = '8px';
        button.addEventListener('click', () => {
          state.fieldRefs[route.preReqField].value = hit.record.value.preReqs.join('\n');
          updateMetaBar();
          closeHelperModal();
        });
        item.appendChild(button);
        els.preReqCloneResults.appendChild(item);
      }
    }

    function renderAvailabilitySearch() {
      const route = ROUTES[state.currentRouteId];
      if (!route?.availabilityField) return;

      const records = state.routeData[state.currentRouteId]?.records || [];
      const query = els.availabilitySearchInput.value.trim().toLowerCase();
      const hits = records.filter(record => {
        if (!record.value?.[route.availabilityField]) return false;
        const haystack = `${record.primaryKey} ${safeJson(record.value[route.availabilityField])}`.toLowerCase();
        return !query || haystack.includes(query);
      }).slice(0, 10);

      els.availabilityResults.innerHTML = '';
      for (const hit of hits) {
        const item = document.createElement('div');
        item.className = 'helper-item';
        item.innerHTML = `<strong>${escapeHtml(hit.primaryKey)}</strong><div class="small muted">Reuse ${escapeHtml(route.availabilityField)}</div>`;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Copy availability';
        button.style.marginTop = '8px';
        button.addEventListener('click', () => {
          state.fieldRefs[route.availabilityField].value = JSON.stringify(hit.value[route.availabilityField], null, 2);
          updateMetaBar();
          closeHelperModal();
        });
        item.appendChild(button);
        els.availabilityResults.appendChild(item);
      }
    }

    function renderLifeScaleBaseSearch() {
      if (state.currentRouteId !== 'lifescales') return;
      const records = state.routeData.lifescales?.records || [];
      const query = els.lifeScaleBaseInput.value.trim().toLowerCase();
      const hits = records.filter(record => `${record.primaryKey} ${record.secondaryKey}`.toLowerCase().includes(query || '')).slice(0, 12);

      els.lifeScaleBaseResults.innerHTML = '';
      for (const hit of hits) {
        const item = document.createElement('div');
        item.className = 'helper-item';
        item.innerHTML = `<strong>${escapeHtml(hit.primaryKey)} / ${escapeHtml(hit.secondaryKey || '')}</strong><div class="small muted">${hit.value.length} rows</div>`;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Use as base';
        button.style.marginTop = '8px';
        button.addEventListener('click', () => {
          state.fieldRefs.__points.value = lifeScalePointsToText(hit.value);
          updateMetaBar();
          closeHelperModal();
        });
        item.appendChild(button);
        els.lifeScaleBaseResults.appendChild(item);
      }
    }

    function appendLineValue(fieldKey, nextValue) {
      const control = state.fieldRefs[fieldKey];
      const existing = control.value.split('\n').map(line => line.trim()).filter(Boolean);
      if (!existing.includes(nextValue)) existing.push(nextValue);
      control.value = existing.join('\n');
      updateMetaBar();
    }

    function openHelperModal(type) {
      const route = ROUTES[state.currentRouteId];
      if (!route || route.id === 'home') return;

      state.activeHelperModal = type;
      if (type === 'prereq') {
        state.preReqTab = 'clone';
        renderPreReqCloneSearch();
        renderPreReqSearch();
      }
      if (type === 'availability') renderAvailabilitySearch();
      if (type === 'lifescale-base') renderLifeScaleBaseSearch();
      renderHelperModalState();
      els.helperModalOverlay.classList.remove('hidden');
    }

    function closeHelperModal() {
      state.activeHelperModal = null;
      els.helperModalOverlay.classList.add('hidden');
    }

    function renderHelperModalState() {
      const route = ROUTES[state.currentRouteId];
      const type = state.activeHelperModal;

      els.preReqModalTabs.classList.toggle('hidden', type !== 'prereq');
      els.preReqClonePanel.classList.toggle('hidden', !(type === 'prereq' && state.preReqTab === 'clone'));
      els.preReqAddPanel.classList.toggle('hidden', !(type === 'prereq' && state.preReqTab === 'add'));
      els.availabilityPanel.classList.toggle('hidden', type !== 'availability');
      els.lifeScaleBasePanel.classList.toggle('hidden', type !== 'lifescale-base');
      els.preReqTabCloneBtn.classList.toggle('active', state.preReqTab === 'clone');
      els.preReqTabAddBtn.classList.toggle('active', state.preReqTab === 'add');

      if (type === 'prereq' && route) {
        els.helperModalTitle.textContent = 'Manage prerequisites';
        els.helperModalSubtitle.textContent = `Build ${route.preReqField} by cloning an existing set or adding abilities one at a time.`;
        return;
      }

      if (type === 'availability' && route) {
        els.helperModalTitle.textContent = 'Copy availability';
        els.helperModalSubtitle.textContent = `Reuse ${route.availabilityField} from another ${route.singular}.`;
        return;
      }

      if (type === 'lifescale-base') {
        els.helperModalTitle.textContent = 'Use an existing lifescale as a base';
        els.helperModalSubtitle.textContent = 'Pick an existing race and class combination to seed the points list.';
        return;
      }

      els.helperModalTitle.textContent = 'Helper';
      els.helperModalSubtitle.textContent = '';
    }

    function showOverlay(title, message) {
      els.overlayTitle.textContent = title;
      els.overlayMessage.textContent = message;
      els.pageOverlay.classList.remove('hidden');
    }

    function hideOverlay() {
      els.pageOverlay.classList.add('hidden');
    }

    function showAlert(message, isError) {
      clearTimeout(state.alertTimer);
      els.completionAlert.textContent = message;
      els.completionAlert.classList.toggle('error', !!isError);
      els.completionAlert.classList.remove('hidden');
      state.alertTimer = window.setTimeout(() => {
        els.completionAlert.classList.add('hidden');
      }, isError ? 5000 : 3200);
    }

    function deepClone(value) {
      return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    }

    function safeJson(value) {
      try { return JSON.stringify(value); }
      catch { return ''; }
    }

    function slugify(input) {
      return String(input || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'unnamed';
    }

    function capitalize(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
