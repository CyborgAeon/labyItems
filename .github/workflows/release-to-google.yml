name: MAUI Android Release + Play Internal

on:
  push:
    tags:
      - "r*.*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: macos-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workload ios
        run: dotnet workload install ios

      - name: Install workload Maui-android
        run: dotnet workload install maui-android

      - name: Install workload Maui-ios
        run: dotnet workload install maui-ios

      - name: Install workload maccatalyst
        run: dotnet workload install maccatalyst

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null; then
            brew install jq || true
          fi

      - name: Trigger seed-db workflow and wait for completion
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.SEED_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          echo "Release build detected (tag). Triggering seed-db workflow on 'init' and waiting for success..."
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          response=$(curl -s -i -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/seed-db.yml/dispatches" \
            -d '{"ref":"init"}' -w "\nHTTP_STATUS:%{http_code}\n")
          echo "Dispatch response: $response"
          http_status=$(echo "$response" | tail -n1 | sed -n 's/HTTP_STATUS://p')
          if [ "$http_status" != "204" ]; then
            exit 1
          fi

          for i in $(seq 1 90); do
            sleep 10
            runs_json=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/seed-db.yml/runs?branch=init&event=workflow_dispatch&per_page=10")
            run_id=$(echo "$runs_json" | jq -r --arg now "$now" '.workflow_runs[] | select(.created_at > $now) | .id' | head -n1 || true)

            if [ -n "$run_id" ]; then
              status=$(echo "$runs_json" | jq -r --arg id "$run_id" '.workflow_runs[] | select(.id == ($id|tonumber)) | .status')
              conclusion=$(echo "$runs_json" | jq -r --arg id "$run_id" '.workflow_runs[] | select(.id == ($id|tonumber)) | .conclusion')
              echo "Seed run $run_id status=$status conclusion=$conclusion"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Seed workflow completed successfully."
                  break
                else
                  echo "Seed workflow completed with conclusion: $conclusion" >&2
                  exit 1
                fi
              fi
            fi

            if [ "$i" -eq 90 ]; then
              echo "Timeout waiting for seed-db workflow to complete" >&2
              exit 1
            fi
          done

      - name: Download seeded DB artifact
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.SEED_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          runs_api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/seed-db.yml/runs?status=success&branch=init&per_page=5"
          run_id=$(curl -s -H "Authorization: token $GH_TOKEN" "$runs_api" | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful seed-db workflow run found" >&2
            exit 1
          fi

          artifacts=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts")
          artifact_id=$(echo "$artifacts" | jq -r '.artifacts[] | select(.name=="laby.db") | .id // empty')
          if [ -z "$artifact_id" ]; then
            echo "No laby.db artifact found in run $run_id" >&2
            exit 1
          fi

          curl -s -L -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" \
            --output artifact.zip

          mkdir -p artifact && unzip -q artifact.zip -d artifact
          dbfile=$(find artifact -type f -name 'laby.db' | head -n1 || true)
          if [ -z "$dbfile" ]; then
            echo "laby.db not found in artifact zip" >&2
            exit 1
          fi

          mkdir -p output/
          cp "$dbfile" output/laby.db
          rm -rf artifact artifact.zip

      - name: Restore
        run: dotnet restore labyItems/labyItems.csproj

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret missing" >&2
            exit 1
          fi
          mkdir -p labyItems
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > labyItems/labyItems.keystore

      - name: Publish Android Release (signed AAB)
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "$var is not set" >&2
              exit 1
            fi
          done

          dotnet publish labyItems/labyItems.csproj \
            -f net10.0-android \
            -c Release \
            -clp:ErrorsOnly \
            -p:AndroidKeyStore=true \
            -p:AndroidPackageFormats=aab \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyStore="$(pwd)/labyItems/labyItems.keystore"

      - name: Find signed AAB
        id: aab
        run: |
          set -euo pipefail
          aab_path=$(find labyItems/bin/Release/net10.0-android/publish -name "*-signed.aab" | head -n 1)
          if [ -z "$aab_path" ]; then
            echo "No signed AAB found under labyItems/bin/Release/net10.0-android/publish" >&2
            find labyItems/bin/Release/net10.0-android/publish -type f
            exit 1
          fi
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: labyItems-aab
          path: ${{ steps.aab.outputs.aab_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.aab.outputs.aab_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to Google Play internal track
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: bard.uk.labyitems
          releaseFiles: ${{ steps.aab.outputs.aab_path }}
          track: internal
          status: completed
