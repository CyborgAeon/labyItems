name: MAUI Android Release

on:
  push:
    tags:
      - 'v*'       # e.g. v1.0.0, v1.2.3
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build-android:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore labyItems/labyItems.csproj

      - name: Restore keystore
        run: |
          mkdir -p labyItems/labyItems
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > labyItems/labyItems/labyItems.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Publish Android Release
        env:
          AndroidSigningKeyPass: ${{ secrets.ANDROID_SIGNING_KEY_PASS }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_SIGNING_STORE_PASS }}
        run: >
          dotnet publish
          labyItems/labyItems/labyItems.csproj
          -f net8.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:GenerateAppBundle=false

      - name: Find APK
        id: apk
        run: |
          apk_path=$(find . -name "*-Signed.apk" -o -name "*.apk" | head -n 1)
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
