name: MAUI Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: macos-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workload ios 
        run: dotnet workload install ios
      - name: Install workload Maui-android
        run: dotnet workload install maui-android
      - name: Install workload Maui-ios
        run: dotnet workload install maui-ios
      - name: Install workload maccatalyst
        run: dotnet workload install maccatalyst

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null; then
            brew install jq || true
          fi

      - name: Download seeded DB artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Looking for latest successful seed-db.yml run on branch 'main'"
          runs_api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/seed-db.yml/runs?status=success&branch=main&per_page=5"
          run_id=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$runs_api" | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful seed-db workflow run found; continuing without packaged DB."
          else
            echo "Found run id: $run_id. Checking artifacts..."
            artifacts=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts")
            artifact_id=$(echo "$artifacts" | jq -r '.artifacts[] | select(.name=="default.db") | .id // empty')
            if [ -z "$artifact_id" ]; then
              echo "No default.db artifact found in run $run_id; continuing without packaged DB."
            else
              echo "Found artifact id $artifact_id; downloading..."
              curl -s -L -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" --output artifact.zip
              mkdir -p artifact && unzip -q artifact.zip -d artifact
              mkdir -p labyItems/Resources/Raw
              dbfile=$(find artifact -type f -name 'default.db' | head -n1 || true)
              if [ -z "$dbfile" ]; then
                echo "default.db not found in artifact zip" >&2
                exit 1
              fi
              cp "$dbfile" labyItems/Resources/Raw/default.db
              echo "Copied default.db into labyItems/Resources/Raw/default.db"
              rm -rf artifact artifact.zip
            fi
          fi

      - name: Restore
        run: dotnet restore labyItems/labyItems.csproj

      - name: Restore keystore
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret missing" >&2
            exit 1
          fi

          mkdir -p labyItems
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > labyItems/labyItems.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Publish Android Release
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "$var is not set" >&2
              exit 1
            fi
          done

          dotnet publish labyItems/labyItems.csproj \
            -f net10.0-android \
            -c Release \
            -clp:ErrorsOnly \
            -p:AndroidPackageFormat=apk \
            -p:GenerateAppBundle=false \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyStore="$(pwd)/labyItems/labyItems.keystore"

      - name: Find APK
        id: apk
        run: |
          set -euo pipefail
          apk_path=$(find labyItems/bin/Release/net10.0-android -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found under labyItems/bin/Release/net10.0-android" >&2
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: labyItems-apk
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
