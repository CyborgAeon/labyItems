name: MAUI Android Release

on:
  push:
    tags:
      - 'v*'       # e.g. v1.0.0, v1.2.3

jobs:
  build-android:
    runs-on: macos-latest  # MAUI Android needs macOS or Windows on Actions

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # or 7.0.x depending on your MAUI version

      # If you need workloads (first time on a clean runner)
      - name: Install MAUI workload
        run: dotnet workload install maui

      # Restore
      - name: Restore
        run: dotnet restore labyItems/labyItems/labyItems.csproj

      # Build/publish Android APK (signed via your csproj/proj properties)
      - name: Publish Android Release
        env:
          AndroidSigningKeyPass: ${{ secrets.ANDROID_SIGNING_KEY_PASS }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_SIGNING_STORE_PASS }}
        run: >
          dotnet publish
          labyItems/labyItems/labyItems.csproj
          -f net8.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:GenerateAppBundle=false


      # The APK usually ends up under:
      # bin/Release/net8.0-android/*-Signed.apk (or similar; you can adjust path)

      - name: Find APK
        id: apk
        run: |
          apk_path=$(find . -name "*-Signed.apk" -o -name "*.apk" | head -n 1)
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
