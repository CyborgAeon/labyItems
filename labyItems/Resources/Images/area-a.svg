<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <style>
    .cave-region {
      fill: rgba(212, 175, 55, 0.2);
      stroke: #d4af37;
      stroke-width: 2.5;
      stroke-linejoin: round;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cave-region:hover {
      fill: rgba(255, 218, 102, 0.45);
      stroke: #ffffff;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 6px #ffda66);
    }
    .room-label {
      font-family: 'Cinzel', 'Georgia', serif;
      font-size: 13px;
      font-weight: bold;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      text-shadow: 0px 0px 4px #000, 0px 0px 8px #000;
    }
  </style>

  <!-- Area A Polygons & Labels -->
  <g id="area-a-overlay">
    <!-- Chamber A1 -->
    <polygon id="area-a1" class="cave-region" points="650,710 750,700 760,750 660,760" />
    <text x="705" y="730" class="room-label">A1</text>

    <!-- Chamber A2 -->
    <polygon id="area-a2" class="cave-region" points="520,670 620,660 630,720 520,730" />
    <text x="572" y="695" class="room-label">A2</text>

    <!-- Chamber A3: The AP Room -->
    <polygon id="area-a3" class="cave-region" points="580,600 660,590 660,650 580,650" />
