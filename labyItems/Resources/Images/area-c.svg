<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <style>
    .cave-region {
      fill: rgba(212, 175, 55, 0.2);
      stroke: #d4af37;
      stroke-width: 2.5;
      stroke-linejoin: round;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cave-region:hover {
      fill: rgba(255, 218, 102, 0.45);
      stroke: #ffffff;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 6px #ffda66);
    }
    .room-label {
      font-family: 'Cinzel', 'Georgia', serif;
      font-size: 13px;
      font-weight: bold;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      text-shadow: 0px 0px 4px #000, 0px 0px 8px #000;
    }
  </style>

<!-- Chamber C2 -->
<polygon id="area-c2" class="cave-region" points="490,480 600,480 600,550 490,550" />
<text x="545" y="515" class="room-label">C2</text>

