name: Build Android (APK) and create Release

on:
  push:
    tags:
      - 'v*'                 # runs on tags like v1.0.0
  workflow_dispatch:         # allow manual runs (for smoke tests)

permissions:
  contents: write            # needed to create a GitHub Release

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '8.0.x'
      PACKAGE_FORMAT: ${{ secrets.APP_PACKAGE_FORMAT || 'apk' }}
      PROJECT_PATH: 'labyItems/labyItems.csproj'  # <-- set this correctly

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # makes tag info available for actions if needed

      - name: Show tag/ref
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          git describe --tags --always || true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload restore

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Publish Android
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -f net8.0-android \
            -p:AndroidPackageFormat=${{ env.PACKAGE_FORMAT }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=$(pwd)/keystore.jks \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: List publish output
        run: |
          echo "Searching for APK/AAB..."
          find . -path "*/bin/Release/net8.0-android/publish/*" -maxdepth 1 -type f -printf "%p\n" || true

      - name: Find output
        id: findpkg
        run: |
          FILE=$(ls **/bin/Release/net8.0-android/publish/*.{apk,aab} 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "No package found in publish directory!" >&2
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Found: $FILE"

      - name: Upload artifact (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ${{ steps.findpkg.outputs.file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.findpkg.outputs.file }}
          generate_release_notes: true
