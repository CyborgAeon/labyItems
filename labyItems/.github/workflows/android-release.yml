name: Build Android (APK) and create Release

on:
  push:
    tags:
      - 'v*'           
  workflow_dispatch:  

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '8.0.x'
      PACKAGE_FORMAT: ${{ secrets.APP_PACKAGE_FORMAT || 'apk' }}
      PROJECT_PATH: 'src/labyItems/labyItems.csproj'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload restore

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Publish Android
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -f net8.0-android \
            -p:AndroidPackageFormat=${{ env.PACKAGE_FORMAT }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=$(pwd)/keystore.jks \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Find output
        id: findapk
        run: |
          OUTDIR="**/bin/Release/net8.0-android/publish"
          FILE=$(ls $OUTDIR/*.{apk,aab} 2>/dev/null | head -n1)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ${{ steps.findapk.outputs.file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.findapk.outputs.file }}
          generate_release_notes: true
